name: Vault Camera Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/prepare_android.sh

      - name: Verify security-critical Android files
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/example/vaultcamera/MainActivity.kt
          grep -q 'FLAG_SECURE' android/app/src/main/kotlin/com/example/vaultcamera/MainActivity.kt
          grep -q 'USE_BIOMETRIC' android/app/src/main/AndroidManifest.xml
          grep -q 'CAMERA' android/app/src/main/AndroidManifest.xml

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: SHA-256
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk             | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-camera-app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
